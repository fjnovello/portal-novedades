name: Actualizar novedades

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas
  workflow_dispatch: {}       # botón "Run workflow" para correrlo a mano

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    env:
      FTP_SERVIDOR: ${{ secrets.FTP_SERVIDOR }}
      SITIO_DISPATCH_TOKEN: ${{ secrets.SITIO_DISPATCH_TOKEN }}
    outputs:
      # GitHub Pages solo si no hay ni FTP ni sitio nuevo.
      publicar_pages: ${{ secrets.FTP_SERVIDOR == '' && secrets.SITIO_DISPATCH_TOKEN == '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Buscar, traducir, completar y construir
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DOMINIO_PROPIO: ${{ vars.DOMINIO_PROPIO }}
        run: python actualizar.py todo
      - name: Guardar la base de notas
        run: |
          git config user.name "Robot Novedades Consulmed"
          git config user.email "novedades@consulmed.com.ar"
          git add data/
          git diff --cached --quiet || git commit -m "Novedades $(date -u +'%Y-%m-%d %H:%M')"
          git push

      # Sitio nuevo (github.com/fjnovello/consulmed-sitio, Cloud Run): el portal armado queda en la rama "publicado"
      # (un solo commit, se pisa en cada corrida) y se le avisa al sitio para que se vuelva a desplegar con las notas nuevas.
      # El aviso necesita el secreto SITIO_DISPATCH_TOKEN (token con permiso Actions/Contents de escritura sobre consulmed-sitio).
      - name: Publicar para el sitio nuevo (rama publicado)
        # Mientras conviva con Ferozo, un error acá no frena la publicación por FTP.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd sitio
          rm -rf .git
          git init -q -b publicado
          git add -A
          git -c user.name="Robot Novedades Consulmed" -c user.email="novedades@consulmed.com.ar" \
            commit -qm "Portal publicado $(date -u +'%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" publicado
          rm -rf .git
      - name: Avisar al sitio nuevo
        if: env.SITIO_DISPATCH_TOKEN != ''
        continue-on-error: true
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${SITIO_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/fjnovello/consulmed-sitio/dispatches \
            -d '{"event_type":"novedades"}'

      # Opción A: publicar en el hosting actual por FTP (Ferozo). Se apaga borrando los secretos FTP_* cuando
      # consulmed.com.ar apunte al sitio nuevo.
      # Se activa sola si existen los secretos FTP_SERVIDOR, FTP_USUARIO y FTP_CLAVE.
      - name: Publicar por FTP
        id: ftp
        if: env.FTP_SERVIDOR != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVIDOR }}
          username: ${{ secrets.FTP_USUARIO }}
          password: ${{ secrets.FTP_CLAVE }}
          protocol: ${{ vars.FTP_PROTOCOLO || 'ftps' }}
          local-dir: ./sitio/
          server-dir: ${{ vars.FTP_CARPETA || './novedades/' }}

      # Opción B: GitHub Pages (si no hay FTP ni sitio nuevo configurados)
      - uses: actions/upload-pages-artifact@v3
        if: env.FTP_SERVIDOR == '' && env.SITIO_DISPATCH_TOKEN == ''
        with:
          path: sitio

  pages:
    needs: actualizar
    if: needs.actualizar.outputs.publicar_pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
